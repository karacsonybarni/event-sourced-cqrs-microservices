apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-projection-worker
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-projection-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-projection-worker
        app.kubernetes.io/component: projection
    spec:
      serviceAccountName: runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: escqrs/order-projection-worker:development
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: application-config
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://query-db:5432/orders_query
            - name: DATABASE_USERNAME
              value: orders
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: runtime-secrets
                  key: query-db-password
          ports:
            - name: management
              containerPort: 8085
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 75m
              memory: 320Mi
            limits:
              cpu: 500m
              memory: 576Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
