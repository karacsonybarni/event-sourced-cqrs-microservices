apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: edge-proxy-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-proxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: edge-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge-proxy
        app.kubernetes.io/component: edge
    spec:
      serviceAccountName: runtime
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: caddy
          image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
          args: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
          envFrom:
            - configMapRef:
                name: runtime-config
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
            - name: admin
              containerPort: 2019
          startupProbe:
            httpGet:
              path: /config/
              port: admin
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /config/
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /config/
              port: admin
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
            runAsUser: 0
          volumeMounts:
            - name: configuration
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: data
              mountPath: /data
            - name: runtime-config
              mountPath: /config
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: configuration
          configMap:
            name: edge-proxy-config
        - name: data
          persistentVolumeClaim:
            claimName: edge-proxy-data
        - name: runtime-config
          emptyDir:
            sizeLimit: 64Mi
        - name: temporary-files
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: edge-proxy
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: edge-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
