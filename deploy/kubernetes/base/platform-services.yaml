apiVersion: v1
kind: Service
metadata:
  name: command-db
spec:
  ports:
    - name: postgres
      port: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: command-db-external
  labels:
    kubernetes.io/service-name: command-db
addressType: IPv4
ports:
  - name: postgres
    protocol: TCP
    port: 5433
endpoints:
  - addresses: ["127.0.0.1"]
---
