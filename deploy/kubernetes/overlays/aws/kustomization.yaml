apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: escqrs/order-command-service
    newTag: IMAGE_TAG
  - name: escqrs/order-projection-worker
    newTag: IMAGE_TAG
  - name: escqrs/order-query-service
    newTag: IMAGE_TAG
  - name: escqrs/inventory-service
    newTag: IMAGE_TAG
  - name: escqrs/api-gateway
    newTag: IMAGE_TAG
  - name: escqrs/frontend
    newTag: IMAGE_TAG
patches:
  - target:
      group: discovery.k8s.io
      version: v1
      kind: EndpointSlice
    patch: |-
      - op: replace
        path: /endpoints/0/addresses/0
        value: PLATFORM_HOST
  - target:
      group: apps
      version: v1
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          event-sourced-cqrs/runtime-config-revision: RUNTIME_CONFIG_REVISION
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: edge-proxy
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: edge-proxy
  - target:
      version: v1
      kind: Service
      name: edge-proxy
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: edge-proxy
  - target:
      version: v1
      kind: PersistentVolumeClaim
      name: edge-proxy-data
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: edge-proxy-data
  - target:
      version: v1
      kind: Service
      name: frontend
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: add
        path: /spec/externalTrafficPolicy
        value: Local
      - op: replace
        path: /spec/ports/0/port
        value: 8080
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: frontend-ingress
    patch: |-
      - op: remove
        path: /spec/ingress/0/from
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: api-gateway-ingress
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: frontend
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: edge-proxy-ingress
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: edge-proxy-ingress
labels:
  - pairs:
      app.kubernetes.io/environment: aws
    includeSelectors: false
