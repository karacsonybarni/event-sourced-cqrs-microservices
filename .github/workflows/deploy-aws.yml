name: Deploy to AWS

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-cloud-deployment
  cancel-in-progress: false

jobs:
  config:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      public_api_url: ${{ steps.endpoint.outputs.public_api_url }}
    steps:
      - name: Resolve repository-scoped AWS endpoint
        id: endpoint
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${PUBLIC_API_URL}" || ! "${PUBLIC_API_URL}" =~ ^https://[A-Za-z0-9-]+\.execute-api\.${AWS_REGION}\.amazonaws\.com/?$ ]]; then
            echo "Repository PUBLIC_API_URL must be the AWS API Gateway endpoint for ${AWS_REGION}; got: ${PUBLIC_API_URL:-<unset>}" >&2
            exit 1
          fi
          echo "public_api_url=${PUBLIC_API_URL}" >> "${GITHUB_OUTPUT}"

  deploy:
    needs: config
    if: needs.config.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloud
      url: ${{ needs.config.outputs.public_api_url }}
    env:
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REVISION }}
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Resolve managed deployment host
        id: host
        env:
          CONFIGURED_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
        run: |
          set -Eeuo pipefail

          configured_ping="$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=${CONFIGURED_INSTANCE_ID}" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text)"
          if [[ "${configured_ping}" == "Online" ]]; then
            echo "instance_id=${CONFIGURED_INSTANCE_ID}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "Configured instance ${CONFIGURED_INSTANCE_ID} is not online in Systems Manager (status: ${configured_ping:-unknown})." >&2
          echo "Visible Systems Manager managed nodes:" >&2
          aws ssm describe-instance-information \
            --query 'InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus,Platform:PlatformName,AgentVersion:AgentVersion,LastPing:LastPingDateTime}' \
            --output table >&2 || true

          mapfile -t online_instances < <(aws ssm describe-instance-information \
            --filters 'Key=PingStatus,Values=Online' \
            --query 'InstanceInformationList[].InstanceId' \
            --output text | tr '\t' '\n' | sed '/^$/d')

          for candidate in "${online_instances[@]}"; do
            command_id="$(aws ssm send-command \
              --instance-ids "${candidate}" \
              --document-name AWS-RunShellScript \
              --comment 'Identify event-sourced CQRS deployment host' \
              --parameters 'commands=test -x /usr/local/bin/deploy-event-sourced-cqrs && test -r /etc/event-sourced-cqrs/runtime.env' \
              --query 'Command.CommandId' \
              --output text 2>/dev/null || true)"
            [[ -n "${command_id}" && "${command_id}" != "None" ]] || continue

            status=Pending
            for attempt in $(seq 1 12); do
              status="$(aws ssm get-command-invocation \
                --command-id "${command_id}" \
                --instance-id "${candidate}" \
                --query 'Status' \
                --output text 2>/dev/null || printf 'Pending')"
              case "${status}" in
                Success|Cancelled|Failed|TimedOut|Cancelling) break ;;
              esac
              sleep 5
            done

            if [[ "${status}" == "Success" ]]; then
              echo "Recovered current platform instance ${candidate} through the IAM-scoped identity probe."
              echo "instance_id=${candidate}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            echo "Identity probe for ${candidate} ended with ${status} after ${attempt} checks." >&2
          done

          echo 'No online Systems Manager node could be verified as the Terraform-managed deployment host.' >&2
          echo 'The EC2 host is likely stopped, terminated, or unable to reach Systems Manager; AWS-side instance recovery is required.' >&2
          exit 1
      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
        run: |
          remote_command="sudo cloud-init status --wait || exit 1; for attempt in \$(seq 1 180); do state=\$(sudo systemctl show --property=ActiveState --value event-sourced-cqrs.service 2>/dev/null || true); if [ \"\${state}\" != activating ]; then break; fi; echo 'Waiting for the EC2 boot deployment to finish'; sleep 10; done; if [ \"\${state:-unknown}\" = activating ]; then echo 'The EC2 boot deployment did not finish before the deployment timeout' >&2; exit 1; fi; sudo /usr/local/bin/deploy-event-sourced-cqrs ${DEPLOY_REVISION}"
          parameters="$(jq -cn --arg command "${remote_command}" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${DEPLOY_REVISION}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)"

          status=Pending
          for attempt in $(seq 1 150); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || printf 'Pending')"
            case "${status}" in
              Success|Cancelled|Failed|TimedOut|Cancelling)
                break
                ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
          if [ "${status}" != "Success" ]; then
            echo "Deployment command ended with ${status} after ${attempt} checks" >&2
            exit 1
          fi
      - name: Verify the public event-sourced CQRS flow
        env:
          GATEWAY_URL: ${{ needs.config.outputs.public_api_url }}
          VERIFY_PLATFORM: "false"
        run: ./scripts/smoke-test.sh
