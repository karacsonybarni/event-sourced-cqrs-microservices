name: AWS Kubernetes Cutover

on:
  push:
    branches: [feat/aws-kubernetes-runtime]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-cloud-deployment
  cancel-in-progress: false

jobs:
  cutover:
    if: contains(github.event.head_commit.message, '[aws-k8s-cutover]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloud
      url: ${{ vars.PUBLIC_API_URL }}
    env:
      DEPLOY_REVISION: ${{ github.sha }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: k8s-cutover-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Deploy feature revision through Systems Manager
        run: |
          set -Eeuo pipefail
          remote_command="sudo cloud-init status --wait || exit 1; sudo /usr/local/bin/deploy-event-sourced-cqrs ${DEPLOY_REVISION}"
          parameters="$(jq -cn --arg command "${remote_command}" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "AWS Kubernetes cutover ${DEPLOY_REVISION}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)"

          status=Pending
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || printf 'Pending')"
            case "${status}" in
              Success|Cancelled|Failed|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
          if [[ "${status}" != "Success" ]]; then
            echo "Feature deployment ended with ${status} after ${attempt} checks." >&2
            exit 1
          fi
      - name: Verify Kubernetes owns the AWS application tier
        run: |
          set -Eeuo pipefail
          remote_command="cd /opt/event-sourced-cqrs && sudo ./scripts/aws/verify-kubernetes-runtime.sh ${DEPLOY_REVISION}"
          parameters="$(jq -cn --arg command "${remote_command}" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Verify AWS Kubernetes cutover ${DEPLOY_REVISION}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)"

          status=Pending
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || printf 'Pending')"
            case "${status}" in
              Success|Cancelled|Failed|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
          if [[ "${status}" != "Success" ]]; then
            echo "Kubernetes ownership verification ended with ${status} after ${attempt} checks." >&2
            exit 1
          fi
      - name: Verify the public event-sourced CQRS flow
        env:
          GATEWAY_URL: ${{ vars.PUBLIC_API_URL }}
          VERIFY_PLATFORM: "false"
        run: ./scripts/smoke-test.sh
      - name: Verify the public React UI
        env:
          UI_URL: ${{ vars.PUBLIC_API_URL }}
        run: ./scripts/ui-smoke-test.sh
