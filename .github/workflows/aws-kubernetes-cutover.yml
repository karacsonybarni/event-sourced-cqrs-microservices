name: AWS Kubernetes Cutover

on:
  push:
    branches: [feat/aws-kubernetes-runtime]

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-cloud-deployment
  cancel-in-progress: false

jobs:
  cutover:
    if: contains(github.event.head_commit.message, '[aws-k8s-cutover]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloud
      url: ${{ vars.PUBLIC_API_URL }}
    env:
      DEPLOY_REVISION: ${{ github.sha }}
      INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: k8s-cutover-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Deploy feature revision through Systems Manager
        run: |
          set -Eeuo pipefail
          remote_command="sudo cloud-init status --wait || exit 1; sudo /usr/local/bin/deploy-event-sourced-cqrs ${DEPLOY_REVISION}"
          parameters="$(jq -cn --arg command "${remote_command}" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "AWS Kubernetes cutover ${DEPLOY_REVISION}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)"

          status=Pending
          for attempt in $(seq 1 180); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || printf 'Pending')"
            case "${status}" in
              Success|Cancelled|Failed|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}'
          if [[ "${status}" != "Success" ]]; then
            echo "Feature deployment ended with ${status} after ${attempt} checks." >&2
            exit 1
          fi
      - name: Verify Kubernetes owns the AWS application tier
        run: |
          set -Eeuo pipefail
          verification="$(cat <<REMOTE
          set -Eeuo pipefail
          namespace=cqrs-orders
          expected_revision='${DEPLOY_REVISION}'
          expected_deployments="\$(printf '%s\n' api-gateway frontend inventory-service order-command-service order-projection-worker order-query-service)"
          actual_deployments="\$(sudo k3s kubectl --namespace "\${namespace}" get deployments --output jsonpath='{range .items[*]}{.metadata.name}{"\\n"}{end}' | sort)"
          if [[ "\${actual_deployments}" != "\${expected_deployments}" ]]; then
            printf 'Unexpected Kubernetes deployment set.\nExpected:\n%s\nActual:\n%s\n' "\${expected_deployments}" "\${actual_deployments}" >&2
            exit 1
          fi
          for deployment in api-gateway frontend inventory-service order-command-service order-projection-worker order-query-service; do
            image="\$(sudo k3s kubectl --namespace "\${namespace}" get "deployment/\${deployment}" --output jsonpath='{.spec.template.spec.containers[0].image}')"
            case "\${image}" in
              *:"\${expected_revision}") ;;
              *) printf 'Deployment %s uses unexpected image %s.\n' "\${deployment}" "\${image}" >&2; exit 1 ;;
            esac
          done
          sudo k3s kubectl --namespace "\${namespace}" wait --for=condition=Available deployment --all --timeout=180s
          service_type="\$(sudo k3s kubectl --namespace "\${namespace}" get service/frontend --output jsonpath='{.spec.type}')"
          service_port="\$(sudo k3s kubectl --namespace "\${namespace}" get service/frontend --output jsonpath='{.spec.ports[0].port}')"
          if [[ "\${service_type}" != LoadBalancer || "\${service_port}" != 8080 ]]; then
            printf 'Frontend service has unexpected exposure %s:%s.\n' "\${service_type}" "\${service_port}" >&2
            exit 1
          fi
          legacy_services="\$(docker ps --format '{{.Label "com.docker.compose.service"}}' | grep -E '^(frontend|api-gateway|inventory-service|order-command-service|order-projection-worker|order-query-service)$' || true)"
          if [[ -n "\${legacy_services}" ]]; then
            printf 'Legacy Compose application containers are still running:\n%s\n' "\${legacy_services}" >&2
            exit 1
          fi
          printf 'AWS_KUBERNETES_CUTOVER_VERIFIED\n'
          REMOTE
          )"
          parameters="$(jq -cn --arg command "${verification}" '{commands:[$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Verify AWS Kubernetes cutover ${DEPLOY_REVISION}" \
            --parameters "${parameters}" \
            --query 'Command.CommandId' \
            --output text)"
          status=Pending
          for attempt in $(seq 1 60); do
            status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' --output text 2>/dev/null || printf 'Pending')"
            case "${status}" in
              Success|Cancelled|Failed|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          result="$(aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${INSTANCE_ID}" \
            --query '{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}')"
          printf '%s\n' "${result}"
          [[ "${status}" == Success ]]
          grep --quiet AWS_KUBERNETES_CUTOVER_VERIFIED <<<"${result}"
      - name: Verify the public event-sourced CQRS flow
        env:
          GATEWAY_URL: ${{ vars.PUBLIC_API_URL }}
          VERIFY_PLATFORM: "false"
        run: ./scripts/smoke-test.sh
      - name: Verify the public React UI
        env:
          UI_URL: ${{ vars.PUBLIC_API_URL }}
        run: ./scripts/ui-smoke-test.sh
