name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Lint workflow definitions
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - name: Scan infrastructure configuration
        run: >-
          docker run --rm -v "$PWD:/workspace"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          config --skip-version-check --severity HIGH,CRITICAL --exit-code 1 /workspace/infra
      - name: Validate AWS state bootstrap
        run: |
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
          terraform -chdir=infra/aws/bootstrap validate
          terraform -chdir=infra/aws/bootstrap test
      - name: Validate AWS runtime infrastructure
        run: |
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
      - name: Validate Azure state bootstrap
        run: |
          terraform -chdir=infra/azure/bootstrap init -backend=false -input=false
          terraform -chdir=infra/azure/bootstrap validate
          terraform -chdir=infra/azure/bootstrap test
      - name: Validate Azure runtime infrastructure
        run: |
          terraform -chdir=infra/azure init -backend=false -input=false
          terraform -chdir=infra/azure validate
          terraform -chdir=infra/azure test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reject purpose-specific presentation wording
        run: |
          if git grep -I -n -i -E 'inter[v]iew|show[c]ase'; then
            echo 'Use architecture-focused wording in maintained artifacts.' >&2
            exit 1
          fi
      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
      - name: Validate Docker Compose model
        run: |
          docker compose --profile ui config --quiet
          if grep --quiet 'awslogs-stream-prefix' compose.cloud.yml; then
            echo 'awslogs-stream-prefix is an ECS option and is unsupported by the Docker Engine awslogs driver.' >&2
            exit 1
          fi
          COMMAND_DB_PASSWORD=validation \
          QUERY_DB_PASSWORD=validation \
          AWS_REGION=eu-central-1 \
          CLOUDWATCH_LOG_GROUP=/validation/containers \
            docker compose --file compose.yml --file compose.cloud.yml config --quiet
          COMMAND_DB_PASSWORD=validation \
          QUERY_DB_PASSWORD=validation \
          PUBLIC_HOST=validation.example.com \
          ACME_EMAIL=validation@example.com \
          ACTIVITY_FUNCTION_HOST=activity.example.com \
          KAFKA_VNET_HOST=10.42.1.4 \
            docker compose --profile ui --file compose.yml --file compose.azure.yml config --quiet
          docker run --rm \
            --env PUBLIC_HOST=validation.example.com \
            --env ACME_EMAIL=validation@example.com \
            --env ACTIVITY_FUNCTION_HOST=activity.example.com \
            --volume "$PWD/deploy/azure/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh scripts/aws/*.sh scripts/azure/*.sh
          docker run --rm -v "$PWD:/mnt" \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh scripts/aws/*.sh scripts/azure/*.sh

  integration:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start multi-replica architecture
        run: make up
      - name: Verify event-sourced CQRS flow
        run: make smoke
      - name: Verify React order portal
        run: make ui-smoke
      - name: Verify discovery and replica failover
        run: make scale-smoke
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local architecture
        if: always()
        run: make down
