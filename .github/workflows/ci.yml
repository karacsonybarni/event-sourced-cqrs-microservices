name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      integration_required: ${{ steps.integration.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect runtime changes
        id: integration
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          base_sha='${{ github.event.pull_request.base.sha || github.event.before }}'
          head_sha='${{ github.sha }}'
          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi

          if [[ -z "${base_sha}" ]]; then
            echo "No comparison base is available; running integration conservatively."
            echo "required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          mapfile -t changed_files < <(git diff --name-only "${base_sha}" "${head_sha}")
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"

          integration_required=false
          for path in "${changed_files[@]}"; do
            case "${path}" in
              .github/*|infra/*|deploy/*|docs/*|scripts/aws/*|scripts/azure/*|scripts/serverless-smoke-test.sh|compose.azure.yml|compose.cloud.yml|README.md|CONTRIBUTING.md|LICENSE|.aiignore|.editorconfig|.gitattributes|.gitignore)
                ;;
              *)
                integration_required=true
                break
                ;;
            esac
          done

          if [[ "${integration_required}" == "false" && \
                ("${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch") ]]; then
            parent_ci_success="$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${base_sha}&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI" and .status == "completed" and .conclusion == "success")] | length' \
              2>/dev/null || true)"
            if [[ ! "${parent_ci_success}" =~ ^[1-9][0-9]*$ ]]; then
              echo "Parent commit has no completed successful CI; running integration conservatively."
              integration_required=true
            fi
          fi

          echo "required=${integration_required}" >> "${GITHUB_OUTPUT}"
          if [[ "${integration_required}" == "true" ]]; then
            echo "Runtime-relevant or not-yet-validated parent changes require integration tests."
          else
            echo "Only CI, infrastructure, deployment, or documentation files changed after a validated parent; skipping integration tests."
          fi

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra
      - name: Lint workflow definitions
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
      - name: Scan infrastructure configuration
        run: >-
          docker run --rm -v "$PWD:/workspace"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          config --skip-version-check --severity HIGH,CRITICAL --exit-code 1 /workspace/infra
      - name: Scan Kubernetes configuration
        run: >-
          docker run --rm -v "$PWD:/workspace"
          aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          config --skip-version-check --severity HIGH,CRITICAL --exit-code 1 /workspace/deploy/kubernetes
      - name: Validate AWS state bootstrap
        run: |
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
          terraform -chdir=infra/aws/bootstrap validate
          terraform -chdir=infra/aws/bootstrap test
      - name: Validate AWS runtime infrastructure
        run: |
          terraform -chdir=infra/aws init -backend=false -input=false
          terraform -chdir=infra/aws validate
          terraform -chdir=infra/aws test
      - name: Validate Azure state bootstrap
        run: |
          terraform -chdir=infra/azure/bootstrap init -backend=false -input=false
          terraform -chdir=infra/azure/bootstrap validate
          terraform -chdir=infra/azure/bootstrap test
      - name: Validate Azure runtime infrastructure
        run: |
          terraform -chdir=infra/azure init -backend=false -input=false
          terraform -chdir=infra/azure validate
          terraform -chdir=infra/azure test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Reject purpose-specific presentation wording
        run: |
          if git grep -I -n -i -E 'inter[v]iew|show[c]ase' -- . \
            ':(exclude)**/.env' ':(exclude)**/*.key' ':(exclude)**/*.pem' \
            ':(exclude)**/secrets/**' ':(exclude)**/target/**' \
            ':(exclude)**/.terraform/**' ':(exclude)**/*.tfplan' \
            ':(exclude)**/*.tfstate' ':(exclude)**/*.tfstate.*' \
            ':(exclude)**/*.tfvars'; then
            echo 'Use architecture-focused wording in maintained artifacts.' >&2
            exit 1
          fi
      - name: Reject application-level discovery artifacts
        run: |
          if git grep -I -n -i -E 'eure[k]a|discovery[-]server|spring-cloud-starter-netfli[x]|876[1]' \
            -- . ':(exclude)docs/adr/**' \
            ':(exclude)**/.env' ':(exclude)**/*.key' ':(exclude)**/*.pem' \
            ':(exclude)**/secrets/**' ':(exclude)**/target/**' \
            ':(exclude)**/.terraform/**' ':(exclude)**/*.tfplan' \
            ':(exclude)**/*.tfstate' ':(exclude)**/*.tfstate.*' \
            ':(exclude)**/*.tfvars'; then
            echo 'Use deployment-platform DNS and service routing in maintained runtime artifacts.' >&2
            exit 1
          fi
      - name: Verify Maven reactor
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Verify React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run check
      - name: Validate Docker Compose model
        run: |
          docker compose --profile ui config --quiet
          if grep --quiet 'awslogs-stream-prefix' compose.cloud.yml; then
            echo 'awslogs-stream-prefix is an ECS option and is unsupported by the Docker Engine awslogs driver.' >&2
            exit 1
          fi
          COMMAND_DB_PASSWORD=validation \
          QUERY_DB_PASSWORD=validation \
          INVENTORY_DB_PASSWORD=validation \
          AWS_REGION=eu-central-1 \
          CLOUDWATCH_LOG_GROUP=/validation/containers \
            docker compose --file compose.yml --file compose.cloud.yml config --quiet
          COMMAND_DB_PASSWORD=validation \
          QUERY_DB_PASSWORD=validation \
          INVENTORY_DB_PASSWORD=validation \
          PUBLIC_HOST=validation.example.com \
          ACME_EMAIL=validation@example.com \
          ACTIVITY_FUNCTION_HOST=activity.example.com \
          KAFKA_VNET_HOST=10.42.1.4 \
            docker compose --profile ui --file compose.yml --file compose.azure.yml config --quiet
          COMMAND_DB_PASSWORD=validation \
          QUERY_DB_PASSWORD=validation \
          INVENTORY_DB_PASSWORD=validation \
          PUBLIC_HOST=validation.example.com \
          ACME_EMAIL=validation@example.com \
          ACTIVITY_FUNCTION_HOST=activity.example.com \
          KAFKA_VNET_HOST=10.42.1.4 \
          PLATFORM_HOST=10.42.1.4 \
            docker compose --file compose.yml --file compose.azure.yml --file compose.kubernetes-platform.yml config --quiet
          docker run --rm \
            --env PUBLIC_HOST=validation.example.com \
            --env ACME_EMAIL=validation@example.com \
            --env ACTIVITY_FUNCTION_HOST=activity.example.com \
            --volume "$PWD/deploy/kubernetes/base/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d \
            caddy validate --config /etc/caddy/Caddyfile
          if ! grep --fixed-strings --quiet 'header_up Host {upstream_hostport}' deploy/kubernetes/base/Caddyfile; then
            echo 'Caddy 2.10 must send the Azure Function hostname in the upstream Host header.' >&2
            exit 1
          fi
      - name: Validate Kubernetes deployment
        run: ./scripts/validate-kubernetes.sh
      - name: Validate shell scripts
        run: |
          bash -n scripts/*.sh scripts/aws/*.sh scripts/azure/*.sh
          if ! awk '
            /--scripts .*ACTIVITY_FUNCTION_HOST=.*KAFKA_VNET_HOST=.*sudo tee .*&& sudo systemctl start event-sourced-cqrs.service && printf .*AZURE_RUNTIME_INITIALIZATION_SUCCEEDED/ { runtime_initialization = NR }
            /--query .*value\[\]\.message/ { command_output = NR }
            /grep --quiet .*AZURE_RUNTIME_INITIALIZATION_SUCCEEDED/ { success_check = NR }
            /gh variable set AWS_DEPLOY_ENABLED/ { repository_variables = NR }
            END { exit !(runtime_initialization && command_output && success_check && repository_variables && runtime_initialization < command_output && command_output < success_check && success_check < repository_variables) }
          ' scripts/azure/provision.sh; then
            echo 'Azure provisioning must verify successful runtime initialization before configuring repository deployment.' >&2
            exit 1
          fi
          docker run --rm -v "$PWD:/mnt" \
            koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
            scripts/*.sh scripts/aws/*.sh scripts/azure/*.sh

  integration:
    needs: [changes, build, infrastructure]
    if: needs.changes.outputs.integration_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Start multi-replica architecture
        run: make up
      - name: Verify event-sourced CQRS flow
        run: make smoke
      - name: Verify React order portal
        run: make ui-smoke
      - name: Verify platform DNS routing and replica failover
        run: make scale-smoke
      - name: Capture service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local architecture
        if: always()
        run: make down
