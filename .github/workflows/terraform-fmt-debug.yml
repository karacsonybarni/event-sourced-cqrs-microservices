name: Terraform Fmt Debug

on:
  push:
    paths:
      - infra/aws/origin-recovery.tf
      - .github/workflows/terraform-fmt-debug.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - name: Show formatter diff
        run: |
          terraform fmt -recursive infra
          git diff -- infra/aws/origin-recovery.tf
          exit 1
