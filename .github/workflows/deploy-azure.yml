name: Deploy to Azure

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: azure-cloud-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloud
      url: ${{ steps.runtime.outputs.public_api_url }}
    env:
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Resolve latest validated deployment revision
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            validated_run_count="$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${DEPLOY_REVISION}&status=success&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | length')"
            if [[ "${validated_run_count}" -lt 1 ]]; then
              printf 'Revision %s has no successful exact-SHA CI run.\n' "${DEPLOY_REVISION}" >&2
              exit 1
            fi
            printf 'Deploying manually selected revision %s.\n' "${DEPLOY_REVISION}"
            echo "revision=${DEPLOY_REVISION}" >> "${GITHUB_OUTPUT}"
            echo "deploy=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          resolved_revision="${DEPLOY_REVISION}"
          latest_successful_revision="$(gh api \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=main&status=completed&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "CI" and .head_branch == "main" and .conclusion == "success")][0].head_sha // ""' \
            2>/dev/null || true)"

          if [[ -n "${latest_successful_revision}" && "${latest_successful_revision}" != "${DEPLOY_REVISION}" ]]; then
            revision_relation="$(gh api \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/compare/${DEPLOY_REVISION}...${latest_successful_revision}" \
              --jq '.status' \
              2>/dev/null || true)"
            if [[ "${revision_relation}" == "ahead" ]]; then
              resolved_revision="${latest_successful_revision}"
            else
              printf 'Keeping triggering validated revision %s; candidate %s was not proven newer (relation: %s).\n' \
                "${DEPLOY_REVISION}" "${latest_successful_revision}" "${revision_relation:-unknown}" >&2
            fi
          fi

          if [[ "${resolved_revision}" != "${DEPLOY_REVISION}" ]]; then
            printf 'Deploying newer validated main revision %s instead of triggering revision %s.\n' \
              "${resolved_revision}" "${DEPLOY_REVISION}"
          fi
          echo "DEPLOY_REVISION=${resolved_revision}" >> "${GITHUB_ENV}"
          echo "revision=${resolved_revision}" >> "${GITHUB_OUTPUT}"
          echo "deploy=true" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@v7
        if: steps.freshness.outputs.deploy == 'true'
        with:
          ref: ${{ steps.freshness.outputs.revision }}
      - name: Configure short-lived Azure credentials
        if: steps.freshness.outputs.deploy == 'true'
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: actions/setup-java@v6
        if: steps.freshness.outputs.deploy == 'true'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package and deploy the serverless activity projection
        if: steps.freshness.outputs.deploy == 'true'
        env:
          CONFIGURED_FUNCTION_APP_NAME: ${{ vars.AZURE_FUNCTION_APP_NAME }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          function_app_name="${CONFIGURED_FUNCTION_APP_NAME}"
          if [[ -z "${function_app_name}" ]]; then
            subscription_suffix="${SUBSCRIPTION_ID//-/}"
            function_app_name="escqrs-activity-${subscription_suffix:0:10}"
          fi

          if [[ -z "${RESOURCE_GROUP}" || -z "${SUBSCRIPTION_ID}" ]]; then
            echo "Azure deployment repository variables are incomplete." >&2
            exit 1
          fi

          echo "Deploying Function App ${function_app_name} in ${RESOURCE_GROUP}."
          for attempt in {1..18}; do
            if function_access_error="$(az resource show \
              --resource-group "${RESOURCE_GROUP}" \
              --resource-type "Microsoft.Web/sites" \
              --name "${function_app_name}" \
              --output none 2>&1)"; then
              function_access_error=""
              break
            fi

            if [[ "${function_access_error}" != *"AuthorizationFailed"* ]]; then
              printf '%s\n' "${function_access_error}" >&2
              exit 1
            fi

            if ((attempt == 18)); then
              printf '%s\n' "${function_access_error}" >&2
              echo "Azure Function deployment RBAC is not reconciled. Run scripts/azure/reconcile.sh with an Azure account that can manage role assignments." >&2
              exit 1
            fi

            printf 'Waiting for Azure Function RBAC propagation (%d/18)\n' "${attempt}" >&2
            sleep 10
          done

          legacy_runtime_settings="$(az functionapp config appsettings list \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${function_app_name}" \
            --query "[?name=='AzureWebJobsStorage' || name=='DEPLOYMENT_STORAGE_CONNECTION_STRING' || name=='CosmosConnection__credential'].name" \
            --output tsv)"
          if [[ -n "${legacy_runtime_settings}" ]]; then
            printf 'Removing conflicting legacy Function settings:\n%s\n' "${legacy_runtime_settings}"
            mapfile -t legacy_runtime_setting_names <<<"${legacy_runtime_settings}"
            az functionapp config appsettings delete \
              --resource-group "${RESOURCE_GROUP}" \
              --name "${function_app_name}" \
              --setting-names "${legacy_runtime_setting_names[@]}" \
              --output none
          fi

          remaining_legacy_runtime_settings="$(az functionapp config appsettings list \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${function_app_name}" \
            --query "[?name=='AzureWebJobsStorage' || name=='DEPLOYMENT_STORAGE_CONNECTION_STRING' || name=='CosmosConnection__credential'].name" \
            --output tsv)"
          if [[ -n "${remaining_legacy_runtime_settings}" ]]; then
            echo "Conflicting legacy Function settings remain after cleanup." >&2
            printf '%s\n' "${remaining_legacy_runtime_settings}" >&2
            exit 1
          fi

          function_identity_client_id="$(az resource show \
            --resource-group "${RESOURCE_GROUP}" \
            --resource-type "Microsoft.Web/sites" \
            --name "${function_app_name}" \
            --query 'identity.userAssignedIdentities.*.clientId | [0]' \
            --output tsv)"
          if [[ -z "${function_identity_client_id}" ]]; then
            echo "Azure Function user-assigned managed identity is unavailable." >&2
            exit 1
          fi

          az functionapp config appsettings set \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${function_app_name}" \
            --settings \
              "KAFKA_BROKERS=10.42.1.4:9094" \
              "COSMOS_DATABASE_NAME=orders-activity" \
              "COSMOS_CONTAINER_NAME=events" \
              "CosmosConnection__accountEndpoint=https://${function_app_name}.documents.azure.com:443/" \
              "CosmosConnection__clientId=${function_identity_client_id}" \
            --output none

          configured_runtime_settings="$(az functionapp config appsettings list \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${function_app_name}" \
            --query "[?name=='KAFKA_BROKERS' || name=='COSMOS_DATABASE_NAME' || name=='COSMOS_CONTAINER_NAME' || name=='CosmosConnection__accountEndpoint' || name=='CosmosConnection__clientId'].name" \
            --output tsv)"
          if [[ "$(wc -w <<<"${configured_runtime_settings}")" -ne 5 ]]; then
            echo "Azure Function runtime settings did not reconcile completely." >&2
            printf '%s\n' "${configured_runtime_settings}" >&2
            exit 1
          fi

          ./mvnw --batch-mode --no-transfer-progress -pl order-activity-function -am -DskipTests package
          cd order-activity-function/target/azure-functions/order-activity-function
          zip -qr ../../../../order-activity-function.zip .
          cd ../../../..
          az functionapp deployment source config-zip \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${function_app_name}" \
            --src order-activity-function.zip

          # The high-level scale CLI reads the App Service plan, while the deploy
          # identity is intentionally scoped to the Function App. Patch the Flex
          # functionAppConfig directly so no broader plan permission is required.
          function_app_resource_id="$(az resource show \
            --resource-group "${RESOURCE_GROUP}" \
            --resource-type "Microsoft.Web/sites" \
            --name "${function_app_name}" \
            --query id \
            --output tsv)"
          function_app_arm_url="https://management.azure.com${function_app_resource_id}?api-version=2025-03-01"
          function_app_config="$(az rest \
            --method get \
            --url "${function_app_arm_url}" \
            --query properties.functionAppConfig \
            --output json)"
          patched_function_app_config="$(jq \
            '.scaleAndConcurrency.alwaysReady = [{"name":"function:projectOrderActivity","instanceCount":1}]' \
            <<<"${function_app_config}")"
          function_app_patch="$(jq -cn \
            --argjson functionAppConfig "${patched_function_app_config}" \
            '{properties:{functionAppConfig:$functionAppConfig}}')"
          az rest \
            --method patch \
            --url "${function_app_arm_url}" \
            --headers 'Content-Type=application/json' \
            --body "${function_app_patch}" \
            --output none

          always_ready="$(az rest \
            --method get \
            --url "${function_app_arm_url}" \
            --query properties.functionAppConfig.scaleAndConcurrency.alwaysReady \
            --output json)"
          printf 'Azure Function always-ready configuration: %s\n' "${always_ready}"
          jq -e '
            any(.[]; .name == "function:projectOrderActivity" and .instanceCount == 1)
          ' <<<"${always_ready}" >/dev/null
      - name: Deploy the Kubernetes application tier through Azure Run Command
        id: runtime
        if: steps.freshness.outputs.deploy == 'true'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          deployment_output="$(az vm run-command invoke \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${VM_NAME}" \
            --command-id RunShellScript \
            --scripts "sudo cloud-init status --wait && sudo /usr/local/bin/deploy-event-sourced-cqrs ${DEPLOY_REVISION} && public_host=\"\$(sudo sed -n 's/^PUBLIC_HOST=//p' /etc/event-sourced-cqrs/runtime.env)\" && printf 'AZURE_PUBLIC_API_URL=https://%s\\n' \"\${public_host}\" && printf 'AZURE_DEPLOYMENT_SUCCEEDED\\n'" \
            --query 'value[].message' \
            --output tsv)"
          printf '%s\n' "${deployment_output}"
          public_api_url="$(grep -oE 'AZURE_PUBLIC_API_URL=https://[A-Za-z0-9.-]+' <<<"${deployment_output}" | tail -1 | cut -d= -f2-)"
          if [[ -z "${public_api_url}" ]]; then
            echo "Azure runtime did not report its public endpoint." >&2
            exit 1
          fi
          echo "public_api_url=${public_api_url}" >> "${GITHUB_OUTPUT}"
          grep --quiet '^AZURE_DEPLOYMENT_SUCCEEDED$' <<<"${deployment_output}"
      - name: Verify the exact Kubernetes rollout
        if: steps.freshness.outputs.deploy == 'true'
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          remote_verification="$(cat <<REMOTE_SCRIPT
          set -eu
          expected_revision='${DEPLOY_REVISION}'
          for deployment in order-command-service order-projection-worker order-query-service inventory-service api-gateway frontend; do
            image="\$(sudo k3s kubectl --namespace cqrs-orders get "deployment/\${deployment}" --output jsonpath='{.spec.template.spec.containers[0].image}')"
            case "\${image}" in
              *:"\${expected_revision}") ;;
              *)
                printf 'Deployment %s uses unexpected image %s.\n' "\${deployment}" "\${image}" >&2
                exit 1
                ;;
            esac
          done
          edge_revision="\$(sudo k3s kubectl --namespace cqrs-orders get deployment/edge-proxy --output jsonpath='{.spec.template.metadata.annotations.event-sourced-cqrs/deployment-revision}')"
          if [[ "\${edge_revision}" != "\${expected_revision}" ]]; then
            printf 'Edge deployment uses unexpected revision %s.\n' "\${edge_revision}" >&2
            exit 1
          fi
          sudo k3s kubectl --namespace cqrs-orders wait --for=condition=Available deployment --all --timeout=180s
          expected_deployments="\$(printf '%s\n' api-gateway edge-proxy frontend inventory-service order-command-service order-projection-worker order-query-service)"
          actual_deployments="\$(sudo k3s kubectl --namespace cqrs-orders get deployments --output jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sort)"
          if [[ "\${actual_deployments}" != "\${expected_deployments}" ]]; then
            echo 'The Kubernetes application tier contains an unexpected Deployment set.' >&2
            printf 'Expected:\n%s\nActual:\n%s\n' "\${expected_deployments}" "\${actual_deployments}" >&2
            exit 1
          fi
          printf 'KUBERNETES_DEPLOYMENT_VERIFIED\n'
          REMOTE_SCRIPT
          )"
          verification_output="$(az vm run-command invoke \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${VM_NAME}" \
            --command-id RunShellScript \
            --scripts "${remote_verification}" \
            --query 'value[].message' \
            --output tsv)"
          printf '%s\n' "${verification_output}"
          grep --quiet '^KUBERNETES_DEPLOYMENT_VERIFIED$' <<<"${verification_output}"
      - name: Verify the public event-sourced CQRS flow
        if: steps.freshness.outputs.deploy == 'true'
        env:
          GATEWAY_URL: ${{ steps.runtime.outputs.public_api_url }}
          VERIFY_PLATFORM: "false"
        run: ./scripts/smoke-test.sh
      - name: Verify the public React order portal
        if: steps.freshness.outputs.deploy == 'true'
        env:
          UI_URL: ${{ steps.runtime.outputs.public_api_url }}
        run: ./scripts/ui-smoke-test.sh
      - name: Verify the public serverless NoSQL projection
        if: steps.freshness.outputs.deploy == 'true'
        env:
          GATEWAY_URL: ${{ steps.runtime.outputs.public_api_url }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          VM_NAME: ${{ vars.AZURE_VM_NAME }}
        run: |
          if ./scripts/serverless-smoke-test.sh; then
            exit 0
          fi

          echo "Serverless smoke failed; collecting Kafka diagnostics from the Azure VM." >&2
          remote_diagnostics="$(cat <<'REMOTE_SCRIPT'
          echo "=== Kafka VNET listener ==="
          timeout 5 bash -c "</dev/tcp/10.42.1.4/9094" && echo "10.42.1.4:9094 reachable on VM" || true
          echo "=== Activity consumer group ==="
          docker exec cqrs-orders-kafka-1 /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --group order-activity-function-v1 --describe || true
          echo "=== Orders topic offsets ==="
          docker exec cqrs-orders-kafka-1 /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server localhost:9092 --topic orders.events.v1 || true
          echo "=== Activity DLT offsets (payloads redacted) ==="
          docker exec cqrs-orders-kafka-1 /opt/kafka/bin/kafka-get-offsets.sh --bootstrap-server localhost:9092 --topic orders.events.v1.activity.DLT || true
          REMOTE_SCRIPT
          )"
          az vm run-command invoke \
            --resource-group "${RESOURCE_GROUP}" \
            --name "${VM_NAME}" \
            --command-id RunShellScript \
            --scripts "${remote_diagnostics}" \
            --query 'value[].message' \
            --output tsv || true
          exit 1
