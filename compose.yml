name: cqrs-orders

services:
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    ports:
      - "8761:8761"
    environment:
      EUREKA_SELF_PRESERVATION_ENABLED: "false"
      EUREKA_EVICTION_INTERVAL_MS: 5000
      EUREKA_RESPONSE_CACHE_INTERVAL_MS: 5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  command-db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: orders_command
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    volumes:
      - command-db-data:/var/lib/postgresql
      - ./debezium/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_command"]
      interval: 3s
      timeout: 3s
      retries: 20

  query-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orders_query
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5434:5432"
    volumes:
      - query-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_query"]
      interval: 3s
      timeout: 3s
      retries: 20

  inventory-db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql
      - ./debezium/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic orders.events.v1 \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic orders.events.v1.inventory.DLT \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic inventory.events.v1 \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic inventory.events.v1.orders.DLT \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic orders.events.v1.DLT \
          --partitions 3 \
          --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic orders.events.v1.activity.DLT \
          --partitions 3 \
          --replication-factor 1

  debezium:
    image: quay.io/debezium/connect:3.6.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: orders-debezium
      CONFIG_STORAGE_TOPIC: orders.connect.configs
      OFFSET_STORAGE_TOPIC: orders.connect.offsets
      STATUS_STORAGE_TOPIC: orders.connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      command-db:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  debezium-init:
    image: curlimages/curl:8.16.0
    user: root
    volumes:
      - ./debezium/order-events-connector.json:/config/order-events-connector.json:ro
      - ./debezium/inventory-events-connector.json:/config/inventory-events-connector.json:ro
      - ./debezium/register-connector.sh:/config/register-connector.sh:ro
    entrypoint: ["/bin/sh", "/config/register-connector.sh"]
    depends_on:
      debezium:
        condition: service_healthy
      order-command-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  order-command-service:
    build:
      context: .
      dockerfile: order-command-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://command-db:5432/orders_command
      DATABASE_USERNAME: orders
      DATABASE_PASSWORD: orders
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS: 5
      EUREKA_LEASE_EXPIRATION_SECONDS: 15
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SAGA_ACTIVATION_AT: ${SAGA_ACTIVATION_AT:-1970-01-01T00:00:00Z}
    ports:
      - "8081"
    depends_on:
      command-db:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://inventory-db:5432/inventory
      DATABASE_USERNAME: inventory
      DATABASE_PASSWORD: inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS: 5
      EUREKA_LEASE_EXPIRATION_SECONDS: 15
      SAGA_ACTIVATION_AT: ${SAGA_ACTIVATION_AT:-1970-01-01T00:00:00Z}
    ports:
      - "8084"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  order-query-service:
    build:
      context: .
      dockerfile: order-query-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://query-db:5432/orders_query
      DATABASE_USERNAME: orders
      DATABASE_PASSWORD: orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS: 5
      EUREKA_LEASE_EXPIRATION_SECONDS: 15
    ports:
      - "8082"
    depends_on:
      query-db:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS: 5
      EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS: 5
      EUREKA_LEASE_EXPIRATION_SECONDS: 15
    ports:
      - "8080:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      order-command-service:
        condition: service_healthy
      order-query-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q 'CQRS Order Portal'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  command-db-data:
  query-db-data:
  inventory-db-data:
