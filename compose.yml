name: cqrs-orders

services:
  command-db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: orders_command
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5433:5432"
    volumes:
      - command-db-data:/var/lib/postgresql
      - ./debezium/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_command"]
      interval: 3s
      timeout: 3s
      retries: 20

  query-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: orders_query
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5434:5432"
    volumes:
      - query-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders_query"]
      interval: 3s
      timeout: 3s
      retries: 20

  inventory-db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5435:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql
      - ./debezium/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.3.1
    command: ["/workspace/kafka/start-broker.sh"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_INTERNAL_HOST: kafka
      KAFKA_EXTERNAL_HOST: localhost
      KAFKA_EXTERNAL_PORT: 19092
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: kafka:9093,kafka-2:9093,kafka-3:9093
      KAFKA_HEAP_OPTS: -Xms192m -Xmx320m
    mem_limit: 640m
    ports:
      - "19092:9094"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./kafka:/workspace/kafka:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/kafka-controller-ready && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-2:
    image: apache/kafka:4.3.1
    command: ["/workspace/kafka/start-broker.sh"]
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_INTERNAL_HOST: kafka-2
      KAFKA_EXTERNAL_HOST: localhost
      KAFKA_EXTERNAL_PORT: 29092
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: kafka:9093,kafka-2:9093,kafka-3:9093
      KAFKA_HEAP_OPTS: -Xms192m -Xmx320m
    mem_limit: 640m
    ports:
      - "29092:9094"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - ./kafka:/workspace/kafka:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/kafka-controller-ready && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-3:
    image: apache/kafka:4.3.1
    command: ["/workspace/kafka/start-broker.sh"]
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_INTERNAL_HOST: kafka-3
      KAFKA_EXTERNAL_HOST: localhost
      KAFKA_EXTERNAL_PORT: 39092
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: kafka:9093,kafka-2:9093,kafka-3:9093
      KAFKA_HEAP_OPTS: -Xms192m -Xmx320m
    mem_limit: 640m
    ports:
      - "39092:9094"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
      - ./kafka:/workspace/kafka:ro
    depends_on:
      kafka-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/kafka-controller-ready && /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:4.3.1
    environment:
      BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
      CONTROLLER_BOOTSTRAP_SERVERS: kafka:9093,kafka-2:9093,kafka-3:9093
    volumes:
      - ./kafka:/workspace/kafka:ro
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    command: ["/workspace/kafka/reconcile-cluster.sh"]

  debezium:
    image: quay.io/debezium/connect:3.6.1.Final
    environment:
      BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
      GROUP_ID: orders-debezium
      CONFIG_STORAGE_TOPIC: orders.connect.configs
      OFFSET_STORAGE_TOPIC: orders.connect.offsets
      STATUS_STORAGE_TOPIC: orders.connect.statuses
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_PRODUCER_ACKS: all
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "8083:8083"
    depends_on:
      command-db:
        condition: service_healthy
      inventory-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  debezium-init:
    image: curlimages/curl:8.16.0
    user: root
    volumes:
      - ./debezium/order-events-connector.json:/config/order-events-connector.json:ro
      - ./debezium/inventory-events-connector.json:/config/inventory-events-connector.json:ro
      - ./debezium/register-connector.sh:/config/register-connector.sh:ro
    entrypoint: ["/bin/sh", "/config/register-connector.sh"]
    depends_on:
      debezium:
        condition: service_healthy
      order-command-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy

  order-command-service:
    build:
      context: .
      dockerfile: order-command-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://command-db:5432/orders_command
      DATABASE_USERNAME: orders
      DATABASE_PASSWORD: orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
      SAGA_ACTIVATION_AT: ${SAGA_ACTIVATION_AT:-1970-01-01T00:00:00Z}
    ports:
      - "8081"
    depends_on:
      command-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://inventory-db:5432/inventory
      DATABASE_USERNAME: inventory
      DATABASE_PASSWORD: inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
      SAGA_ACTIVATION_AT: ${SAGA_ACTIVATION_AT:-1970-01-01T00:00:00Z}
    ports:
      - "8084"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  order-projection-worker:
    build:
      context: .
      dockerfile: order-projection-worker/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://query-db:5432/orders_query
      DATABASE_USERNAME: orders
      DATABASE_PASSWORD: orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092,kafka-2:9092,kafka-3:9092
    ports:
      - "8085"
    depends_on:
      query-db:
        condition: service_healthy
      debezium-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  order-query-service:
    build:
      context: .
      dockerfile: order-query-service/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://query-db:5432/orders_query
      DATABASE_USERNAME: orders
      DATABASE_PASSWORD: orders
    ports:
      - "8082"
    depends_on:
      query-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      ORDER_COMMAND_URI: http://order-command-service:8081
      ORDER_QUERY_URI: http://order-query-service:8082
    ports:
      - "8080:8080"
    depends_on:
      order-command-service:
        condition: service_healthy
      order-query-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  frontend:
    profiles: ["ui"]
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q 'CQRS Order Portal'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  command-db-data:
  query-db-data:
  inventory-db-data:
  kafka-1-data:
    name: cqrs-orders-kafka-1-data
  kafka-2-data:
    name: cqrs-orders-kafka-2-data
  kafka-3-data:
    name: cqrs-orders-kafka-3-data
