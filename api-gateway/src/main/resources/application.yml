spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-commands
              uri: lb://order-command-service
              predicates:
                - Path=/api/orders/**
                - Method=POST,PUT,DELETE
            - id: order-queries
              uri: lb://order-query-service
              predicates:
                - Path=/api/orders/**
                - Method=GET

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    healthcheck:
      enabled: true
    registry-fetch-interval-seconds: ${EUREKA_REGISTRY_FETCH_INTERVAL_SECONDS:30}
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: ${EUREKA_LEASE_RENEWAL_INTERVAL_SECONDS:30}
    lease-expiration-duration-in-seconds: ${EUREKA_LEASE_EXPIRATION_SECONDS:90}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
    gateway:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Method-aware API gateway for the CQRS order API
