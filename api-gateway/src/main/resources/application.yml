spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: order-commands
              uri: ${ORDER_COMMAND_URI:http://localhost:8081}
              predicates:
                - Path=/api/orders/**
                - Method=POST,PUT,DELETE
            - id: order-queries
              uri: ${ORDER_QUERY_URI:http://localhost:8082}
              predicates:
                - Path=/api/orders/**
                - Method=GET

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
    gateway:
      access: read-only
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Method-aware API gateway for the CQRS order API
