spring:
  application:
    name: discovery-server

server:
  port: 8761
  shutdown: graceful

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION_ENABLED:true}
    eviction-interval-timer-in-ms: ${EUREKA_EVICTION_INTERVAL_MS:60000}
    response-cache-update-interval-ms: ${EUREKA_RESPONSE_CACHE_INTERVAL_MS:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Service registry for dynamic service instances
